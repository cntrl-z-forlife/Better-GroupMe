[package]
name = "groupme-rust-client"
version = "0.1.0"
edition = "2021"

[dependencies]
# The web framework
axum = "0.7"

# Asynchronous runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client for GroupMe API calls
reqwest = { version = "0.12", features = ["json"] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities for logging + CORS (removed "fs" since we no longer need ServeDir)
tower-http = { version = "0.5", features = ["trace", "cors"] }
tower = "0.4"

# Logging and Debugging
tracing = "0.1"
tracing-subscriber = "0.3"

# Embed static assets into the binary
rust-embed = "8"
mime_guess = "2"

# Optional but recommended: auto-open the browser on launch
open = "5"
